version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-backend
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST:
      DB_USER:
      DB_PASS:
      DB_NAME:
      DB_PORT:
      JWT_SECRET:
    networks:
      - backend-net

  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5435:5435'
    networks:
      - backend-net

  redis:
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
